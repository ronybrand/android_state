name: E2E (Android)

# Builds the e2e variant (the release build, minified, signed with the debug key, allowed to talk plain http to
# localhost) against the local mock API, installs it on an emulator and drives the real screens with Maestro. The
# Robolectric tests cannot do this: they fake the Keystore and run a different build of the code than R8 produces.
# A change that only touches docs cannot affect the app, so it should not spend ~15 minutes of emulator time. (If this
# check ever becomes required, a skipped workflow would block merging; revisit then.)
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Caches ~/.gradle (dependencies, wrapper and the build cache). It only WRITES from the default branch: a pull
      # request reads what main saved.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The emulator reaches the host's mock API through `adb reverse`, so the app is built to call localhost:4010.
      # Lint-vital is skipped (see the init script): it guards a build about to be published, and this one is thrown away.
      - name: Build the e2e APK
        run: ./gradlew :app:assembleE2e -PapiUrl=http://localhost:4010 -I e2e/gradle/skip-lint-vital.gradle --build-cache --no-daemon

      # Pinned to a release and checked against the project's published checksum, instead of piping an installer into a
      # shell.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-unpacked"
          mkdir -p "$HOME/.maestro"
          cp -r "$RUNNER_TEMP/maestro-unpacked/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Creating the AVD and cold-booting it costs about a minute and a half. The first run saves a booted snapshot;
      # later runs restore it. Both emulator steps must use the same hardware settings, or the snapshot would not match.
      - name: Cache the emulator snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34-x86_64-pixel_6-v1

      - name: Create the emulator snapshot (only when it is not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot for caching."

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          # Software rendering is CPU-bound; more cores and memory keep the launcher responsive.
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          # -no-snapshot-save: boot from the cached snapshot and do not rewrite it.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          # One line: the action runs a multi-line script line by line.
          script: bash e2e/run-flows.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: maestro-results
          path: |
            e2e-reports/
            ~/.maestro/tests/
          retention-days: 7
