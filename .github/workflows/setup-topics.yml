name: Setup GitHub Topics

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  administration: write

jobs:
  setup-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Topics
        uses: actions/github-script@v9
        with:
          script: |
            const topics = [
              'android',
              'kotlin',
              'jetpack-compose',
              'material-design',
              'android-architecture',
              'mobile-app',
              'rest-api',
              'spring-boot',
              'coroutines',
              'stateflow',
              'okhttp',
              'dependency-injection',
              'mvvm',
              'testing',
              'robolectric',
              'junit',
              'ci-cd',
              'github-actions',
              'security',
              'android-keystore',
              'accessibility'
            ];
            
            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: topics
            });
