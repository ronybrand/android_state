name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Caches the Gradle home and writes it only from the default branch: a pull request reads what main saved.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Style, static analysis, Android lint (warnings are errors), the unit and Compose tests, and the coverage floor.
      # The tests need no device: Robolectric runs the Compose screens on the JVM.
      - name: Lint, static analysis, tests and the coverage floor
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest koverVerify --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  # Proves the release signing wiring with a throwaway key, since the real one is (rightly) not available to CI on pull
  # requests. It also compiles and minifies the whole app in release.
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: A release app bundle without a key refuses to build
        run: |
          if ./gradlew :app:bundleRelease --no-daemon > bundle.log 2>&1; then
            echo "::error::an app bundle was built without key.properties"
            exit 1
          fi
          grep -q "Refusing to build a release app bundle" bundle.log

      # keytool makes PKCS12 keystores, where the key password must equal the keystore password.
      - name: Create a throwaway key and point key.properties at it
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" \
            -storepass ci-pass -keypass ci-pass -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Throwaway, O=android_state"
          bash scripts/ci/write-key-properties.sh
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci.jks
          KEYSTORE_PASSWORD: ci-pass
          KEY_PASSWORD: ci-pass
          KEY_ALIAS: ci

      - name: A release APK is signed with that key, not the debug one
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "CN=CI Throwaway" certs.txt
          ! grep -q "Android Debug" certs.txt

  # CodeQL covers the Kotlin code; this scans the repository itself (committed secrets, misconfiguration) and any
  # known-vulnerable dependency that a lock file or manifest declares.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
